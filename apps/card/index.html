<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The chrome around the app follows the theme; the ThemeProvider keeps the unmediated tag in step. -->
    <meta name="theme-color" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e11" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qrew" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" />
    <!-- iOS ignores an SVG touch icon; this PNG is full-bleed because iOS rounds the corners itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // iOS gives a Home Screen web app its own storage, separate from Safari's, so a card saved in
      // Safari isn't there when the icon opens. With no manifest, iOS opens the icon at the page it
      // was added from (?card=…), and the app keeps that card. Everyone else gets the manifest —
      // Android needs it (and its start_url) to install.
      (function () {
        var ua = navigator.userAgent;
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (ios) return;
        var l = document.createElement("link");
        l.rel = "manifest";
        l.href = "/manifest.webmanifest";
        document.head.appendChild(l);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,300..900;1,400..700&display=swap" rel="stylesheet" />
    <title>Qrew · Your Card</title>
    <script>
      // Apply the saved theme before first paint, or a light flash precedes every dark-mode load.
      (function () {
        try {
          var t = localStorage.getItem("qrew-theme");
          var dark =
            t === "dark" ||
            ((t === "system" || !t) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
