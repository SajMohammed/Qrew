name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Migrations and the admin path run as an owner that is NOT a superuser, the shape AWS RDS
      # gives you. Running them as `postgres` would hide any reliance on superuser privileges.
      DATABASE_URL: postgres://qrew_owner:qrew_owner@localhost:5432/qrew
      # The migrator moves qrew_app off its public default password; the tests then log in with this.
      QREW_APP_PASSWORD: ci-only-app-password-not-a-secret
      DATABASE_URL_APP: postgres://qrew_app:ci-only-app-password-not-a-secret@localhost:5432/qrew
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field; naming one here as well
      # makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create an RDS-like database owner (no superuser, no BYPASSRLS)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "create role qrew_owner login password 'qrew_owner' nosuperuser nobypassrls createrole" \
            -c "create database qrew owner qrew_owner"

      - name: Apply migrations (schema + RLS)
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      # The tenant-isolation suite is the gate: if a merchant can read another's
      # rows, this fails and the merge is blocked.
      - name: Test (incl. RLS tenant-isolation)
        run: pnpm test

      - name: Build
        run: pnpm build
